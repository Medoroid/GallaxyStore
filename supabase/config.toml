# Scoped config: only Google auth + the redirect URLs it needs.
# `supabase config push` leaves every property not declared here unchanged.
# Credentials come from the existing .env.local keys — never stored in this file.

[auth]
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3100/**",
  "https://gallaxy-store.vercel.app/**",
  "https://gallaxy-store-staging.vercel.app/**"
]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
